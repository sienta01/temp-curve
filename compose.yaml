services:
  temp-curve:
    build: .
    image: temp-curve
    container_name: temp-curve
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-8080}:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in the .env file}
    volumes:
      - temp-curve-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  temp-curve-data:
    name: temp-curve-data
